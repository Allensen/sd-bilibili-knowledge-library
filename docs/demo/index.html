:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#263137;background:#f4f5f3;line-height:1.75}*{box-sizing:border-box}body{margin:0}header{background:#173d39;color:#fff;padding:42px max(24px,calc((100vw - 980px)/2)) 32px}header p{color:#c6d9d3;margin:7px 0 22px}h1{font-size:30px;letter-spacing:.02em;margin:0}input{width:100%;padding:14px 18px;border:1px solid #d2ddd8;border-radius:8px;font:inherit;background:#fff;color:#263137}main{max-width:1028px;margin:auto;padding:24px}h2{font-size:23px;margin:8px 0 12px}h3{font-size:18px;margin:0 0 10px}h4{margin:0 0 8px}.card{background:white;border:1px solid #dfe4df;border-radius:10px;padding:24px;margin:16px 0}.meta,.sources{color:#66716d;font-size:13px}.tag{display:inline-block;background:#e8efeb;padding:2px 10px;border-radius:5px;margin-right:7px;font-size:12px}.sources a{margin-right:12px}a{color:#166754;text-underline-offset:3px}.lead{font-size:16px}.tip{background:#f1f5f1;padding:12px 16px;border-left:3px solid #86a89b}.caution{background:#fff8e9;border-color:#eadcbc}.transcript p{padding:12px 0;border-bottom:1px solid #edf0ed;margin:0}.transcript a{font-variant-numeric:tabular-nums;font-size:13px;margin-right:10px}summary{cursor:pointer;font-weight:600}details[open]>summary{margin-bottom:18px}img{max-width:100%;height:auto;border:1px solid #dfe4df;border-radius:5px}figcaption{font-size:12px;color:#66716d}figure{margin:20px 0 0}#status{margin:0 0 18px;color:#66716d;font-size:14px}.empty{padding:30px;background:#fff;border-radius:8px}nav{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-top:14px}ul{padding-left:22px}.muted{font-size:13px;color:#66716d}.article{margin-bottom:42px}footer{max-width:980px;margin:0 auto;padding:16px 0 32px;font-size:12px;color:#66716d}@media(max-width:600px){header{padding:26px 18px}main{padding:16px}.card{padding:18px}h1{font-size:25px}}
.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:24px}.catalog a{padding:16px;background:#e8efeb;border:1px solid #d2ddd8;border-radius:8px;text-decoration:none}.catalog a:hover{background:#dce9e1}.catalog small{display:block;color:#66716d;margin-top:5px}
</style></head><body>
<header><h1>把收藏变成可用的知识</h1><p>先读方法，再看原文；每个知识点都能回到视频。</p><input id="search" type="search" aria-label="搜索知识点或原文" placeholder="搜索问题、知识点或原文，例如：卡片、复盘、背景"></header>
<main><aside id="demo-info" class="card caution"><strong>原创演示 · 功能预览</strong><p>本页包含 2 篇原创示例，试试搜索「卡片」或「复盘」，再点击「阅读全文」。时间按钮会定位本页演示原文；真实知识库会跳到 B 站原视频。本例没有视频或截图。</p><a href="../../README.md">查看使用说明</a></aside><div id="batch-status" class="card"></div><p id="status" role="status" aria-live="polite"></p><nav id="catalog" class="catalog" aria-label="视频目录"></nav><div id="library"></div></main>
<footer>原创演示数据 · 使用正式知识库时，请结合原视频核对机器转写与整理结果。</footer>
<script id="data" type="application/json">[{"source": {"bvid": "DEMO01", "page": 1, "title": "收藏教程后，怎样真正开始练习", "author": "SD 原创演示", "duration": 162, "url": "#demo-info"}, "article": {"title": "收藏教程后，怎样真正开始练习", "tags": ["学习方法", "动手练习"], "takeaways": ["先给这次练习定一个小目标。", "跟着做完，再换一个例子试一遍。", "保留完成的作品和解决问题的记录。"], "knowledge": [{"title": "今天先做出一个最小结果", "explanation": "演示原文先把练习缩小到一件能动手的事，再围绕它找视频片段。", "details": ["例子：学图片排版，先完成一张标题清楚的卡片。", "写下任务，找到演示片段，再做一遍。"], "source_ids": ["s002", "s003"], "learning_tip": "可以把目标写成「我今天要做出……」，检查它是否足够具体。", "frame_ids": []}, {"title": "换一个例子，看看自己能不能做出来", "explanation": "跟做完成后换一张图片或一段文字，独立再试一遍，从卡住的位置找出需要回看的步骤。", "details": ["沿用刚学到的方法，换掉示例素材。", "只把实际卡住的问题记下来，再回看对应片段。"], "source_ids": ["s004"], "frame_ids": []}, {"title": "把踩过的坑写成自己的操作记录", "explanation": "演示原文建议记录当时做了什么、哪里出错、后来怎么调整。下一次遇到相似问题时更容易查。", "details": ["保留这次做出的作品。", "让笔记包含自己遇到的问题和调整过程。"], "source_ids": ["s005", "s006"], "frame_ids": []}], "corrections": [], "caveats": ["本页为原创演示数据，不对应真实视频，不用于证明转写准确率。"]}, "transcript": [{"id": "s001", "start": 0, "end": 18, "text": "今天用一个小例子，讲讲收藏教程以后怎么开始动手。先写下你想完成的东西，再从视频里找到相关的方法。"}, {"id": "s002", "start": 18, "end": 46, "text": "不要一次给自己安排太多任务。比如学图片排版，今天先做一张标题清楚的卡片，做到这里就算完成这一轮练习。"}, {"id": "s003", "start": 46, "end": 77, "text": "把这次任务写下来，然后找到视频中对应的演示段落，跟着操作一次。遇到卡住的地方，记下问题和视频时间，方便再看。"}, {"id": "s004", "start": 77, "end": 110, "text": "跟着做完以后，换一张图片或者换一段文字，自己再试一次。这样能发现自己哪些步骤理解了，哪些地方还要回去看。"}, {"id": "s005", "start": 110, "end": 139, "text": "把刚才卡住的问题写进自己的笔记。记录自己当时做了什么、哪里不对、后来怎么调整，比只抄一句结论更方便下次查。"}, {"id": "s006", "start": 139, "end": 162, "text": "最后留下一张完成的卡片，以及这次练习的几条记录。下次可以换个小任务，继续使用这些步骤。"}], "frames": []}, {"source": {"bvid": "DEMO02", "page": 1, "title": "把一次练习记成下次能用的笔记", "author": "SD 原创演示", "duration": 101, "url": "#demo-info"}, "article": {"title": "把一次练习记成下次能用的笔记", "tags": ["复盘", "笔记"], "takeaways": ["笔记标题直接写遇到的问题。", "记录操作情境和前后变化。", "补上以后可能拿来搜索的词。"], "knowledge": [{"title": "用当时遇到的问题给笔记起名", "explanation": "演示原文用「文字和背景挤在一起，怎么调整」作为标题，把操作情境直接写出来。", "details": ["记录文字、背景和摆放位置。", "把试过的调整以及前后对比保留下来。"], "source_ids": ["s002", "s003"], "frame_ids": []}, {"title": "留下你以后真的会搜索的词", "explanation": "练习结束时补上卡片、文字、背景这样的关键词，方便遇到相似问题时找到旧记录。", "details": ["从实际问题里选词。", "用这些词找回对应的调整过程。"], "source_ids": ["s004"], "frame_ids": []}], "corrections": [], "caveats": ["本页为原创演示数据，不对应真实视频，不用于证明转写准确率。"]}, "transcript": [{"id": "s001", "start": 0, "end": 20, "text": "这次演示介绍一种练习记录的写法：先把自己遇到的问题写清楚，再记解决的过程。"}, {"id": "s002", "start": 20, "end": 46, "text": "例如你做了一张卡片，觉得文字很难看清。笔记标题可以直接写：文字和背景挤在一起，怎么调整。"}, {"id": "s003", "start": 46, "end": 75, "text": "下面写当时用了什么背景、文字放在哪里，然后记录你试过的调整。保留调整前后两张图，方便下次比较。"}, {"id": "s004", "start": 75, "end": 101, "text": "最后给笔记加几个你会搜索的词，比如卡片、文字、背景。以后遇到相似问题，可以用这些词找到当时的记录。"}], "frames": []}]</script>
<script id="batch-data" type="application/json">{"items": [{"id": "DEMO01-p1", "status": "published"}, {"id": "DEMO02-p1", "status": "published"}], "unavailable": []}</script>
<script>
const entries=JSON.parse(document.getElementById('data').textContent),root=document.getElementById('library');
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function time(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`}
function link(text,url){const a=el('a',text);a.href=url;a.target=url.startsWith('#')?'_self':'_blank';a.rel='noopener';if(url.startsWith('#'))a.onclick=()=>{const t=document.getElementById(url.slice(1));if(t?.closest('details'))t.closest('details').open=true};return a}
function list(items){const u=el('ul');items.forEach(x=>u.append(el('li',x)));return u}
function videoLink(e,s){return '#demo-segment-'+e.source.bvid+'-'+Math.floor(s)}
const batch=JSON.parse(document.getElementById('batch-data').textContent),batchPanel=document.getElementById('batch-status');
const stages={pending:'待处理',processing:'处理中',needs_notes:'原文已就绪，待整理',published:'已生成笔记',failed:'处理失败',unavailable:'不可访问'};
batchPanel.append(el('h3','本次处理进度'));
const pending=(batch.items||[]).filter(i=>i.status!=='published');
batchPanel.append(el('p',`${(batch.items||[]).filter(i=>i.status==='published').length} 条已生成 · ${pending.length} 条尚未完成 · ${(batch.unavailable||[]).length} 条不可访问`));
if(pending.length||batch.unavailable?.length){const detail=el('details');detail.append(el('summary','查看尚未完成的条目'),list([...pending,...(batch.unavailable||[])].map(i=>`${i.source?.title||i.title||i.id}：${stages[i.status]||i.status}${i.error?'（'+i.error+'）':''}`)));batchPanel.append(detail)}
function render(query=''){
 root.replaceChildren();const catalog=document.getElementById('catalog');catalog.replaceChildren();let hits=0,documents=0;const q=query.trim().toLowerCase();
 entries.forEach((entry,index)=>{
  const a=entry.article,segments=new Map(entry.transcript.map(s=>[s.id,s])),frames=new Map(entry.frames.map(f=>[f.id,f]));
  const matches=text=>!q||text.toLowerCase().includes(q);
  const points=a.knowledge.filter(k=>matches([k.title,k.explanation,...(k.details||[]),k.learning_tip||''].join(' ')));
  const utterances=entry.transcript.filter(s=>matches(s.text));
  const metaMatch=matches([a.title,...a.tags,...a.takeaways,...a.caveats].join(' '));
  if(!metaMatch&&!points.length&&!utterances.length)return;
  documents++;
  const wrap=el('section',undefined,'article'),intro=el('div',undefined,'card');
  wrap.id=`video-${entry.source.bvid}-p${entry.source.page}`;const shortcut=el('a',a.title);shortcut.href='#'+wrap.id;shortcut.append(el('small',`${time(entry.source.duration)} · ${q?points.length:a.knowledge.length} 个${q?'匹配':''}知识点 · ${q?utterances.length:entry.transcript.length} 段${q?'匹配':''}原文`));catalog.append(shortcut);
  intro.append(el('div',`${entry.source.author} · 原视频 ${time(entry.source.duration)} · 带来源的学习笔记`,'meta'),el('h2',a.title));
  const tags=el('div');a.tags.forEach(t=>tags.append(el('span',t,'tag')));intro.append(tags,list(a.takeaways));
  const nav=el('nav');nav.append(link('演示说明',entry.source.url));const note=link('下载 Markdown',`library/${entry.source.bvid}-p${entry.source.page}/note.md`);note.download='';nav.append(note);
  const jump=el('a','阅读全文');jump.href=`#transcript-${index}`;jump.onclick=event=>{event.preventDefault();if(q){document.getElementById('search').value='';render()}const target=document.getElementById(`transcript-${index}`);target.open=true;target.scrollIntoView({block:'start'})};nav.append(jump);intro.append(nav);wrap.append(intro);
  const shown=q?points:a.knowledge;
  shown.forEach(k=>{const card=el('section',undefined,'card knowledge');card.append(el('h3',k.title),el('p',k.explanation));if(k.details?.length)card.append(list(k.details));if(k.learning_tip)card.append(el('p','理解提示 · '+k.learning_tip,'tip'));const refs=el('div','回看视频：','sources');k.source_ids.forEach(id=>{const s=segments.get(id);refs.append(link(time(s.start),videoLink(entry,s.start)))});card.append(refs);
   if(k.frame_ids?.length){const evidence=el('details');evidence.append(el('summary',`查看原视频画面 · ${k.frame_ids.length} 张`));k.frame_ids.forEach(id=>{const f=frames.get(id),figure=el('figure'),img=el('img');img.src=`library/${entry.source.bvid}-p${entry.source.page}/${f.file}`;img.alt=`原视频 ${time(f.second)} 画面证据`;img.loading='lazy';const caption=el('figcaption','原视频画面 · ');caption.append(link(time(f.second),videoLink(entry,f.second)));figure.append(img,caption);evidence.append(figure)});card.append(evidence)}wrap.append(card);hits++});
  const cautions=el('section',undefined,'card caution');cautions.append(el('h3','仍需核对的内容'),list(a.caveats));wrap.append(cautions);
  const full=el('details',undefined,'card transcript');full.id=`transcript-${index}`;full.open=!!q;full.append(el('summary',`全文转写 · ${q?utterances.length:entry.transcript.length} 段${q?'匹配':''}`),el('p','这里展示原创演示文本及其时间标记，不是真实视频的机器转写。','muted'));
  (q?utterances:entry.transcript).forEach(s=>{const p=el('p');p.id='demo-segment-'+entry.source.bvid+'-'+Math.floor(s.start);p.append(link(time(s.start),videoLink(entry,s.start)),document.createTextNode(s.text));full.append(p)});wrap.append(full);hits+=q?utterances.length:0;
  if(a.corrections?.length){const changes=el('details',undefined,'card');changes.append(el('summary','局部修订记录'),list(a.corrections.map(c=>`${c.before} → ${c.after}（${c.reason}）`)));wrap.append(changes)}
  root.append(wrap);
 });
 document.getElementById('status').textContent=q?`搜索“${query}” · ${documents} 条视频相关 · ${hits} 个知识点或原文片段匹配`:`已整理 ${entries.length} 条视频 · 可搜索知识点与全文`;
 if(!root.children.length)root.append(el('p','没有找到匹配内容，请尝试其他关键词。','empty'));
}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));render();
</script></body></html>
